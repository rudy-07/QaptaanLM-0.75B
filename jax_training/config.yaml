# ============================================================
# QaptaanLM-0.75B (Qwen3.5-0.8B) JAX CPT Configuration
# Optimized for Google Kaggle TPU v5e-8 (8 TPU cores, 16GB HBM/core)
# ============================================================

model:
  name_or_path: "Qwen/Qwen3.5-0.8B-Base"
  dtype: "bfloat16"
  vocab_size: 248320
  hidden_size: 1024
  intermediate_size: 3584
  num_hidden_layers: 24
  num_attention_heads: 8
  num_key_value_heads: 2
  head_dim: 256
  rms_norm_eps: 1.0e-6
  tie_word_embeddings: true
  full_attention_interval: 4
  linear_conv_kernel_dim: 4
  linear_num_key_heads: 16
  linear_num_value_heads: 16
  linear_key_head_dim: 128
  linear_value_head_dim: 128

training:
  output_dir: "checkpoints/jax_cpt"
  target_tokens: 1_000_000_000  # 1 Billion tokens
  
  # Sequence length & lazy windowing over 4096-token packed shards
  max_seq_length: 1024
  dataset_packed_seq_length: 4096
  
  # Batch size per TPU device (8 devices on TPU v5e-8 / v3-8)
  # With per_device_batch_size=2: global batch = 2 * 8 = 16 sequences = 16,384 tokens/step
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 1
  
  # Chunked linear cross-entropy chunk size (tokens per projection step)
  # 256 guarantees safe HBM allocation (<15.75 GB) during JIT backward pass with zero OOM risk
  loss_chunk_size: 256
  
  # Learning rate and cosine scheduler
  learning_rate: 2.0e-5
  min_lr_ratio: 0.1
  warmup_ratio: 0.02
  warmup_steps: null  # auto-computed from target_tokens if null
  weight_decay: 0.01
  max_grad_norm: 1.0
  
  # AdamW optimizer settings
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_epsilon: 1.0e-8
  
  # Precision & seed
  dtype: "bfloat16"
  seed: 42
  
  # Logging & Checkpointing (save every 2500 steps, max 2 checkpoints)
  logging_steps: 50
  save_steps: 1000
  save_total_limit: 2
  resume_from_checkpoint: null  # null = auto-discover newest in output_dir

storage:
  data_dir: "/kaggle/working/data"
  export_hf: true
  hf_export_dir: "checkpoints/jax_cpt_hf"
