# Qwen3.5-0.8B CPT + SFT Fine-Tuning Pipeline

# ============================================================
# Model Configuration
# ============================================================
model:
  # Use HF Hub name or local path
  name_or_path: "Qwen/Qwen3.5-0.8B-Base"
  # For text-only CPT, use the causal LM class (strips vision automatically)
  model_class: "Qwen3_5ForCausalLM"
  tokenizer_class: "auto"
  # Whether to use trust_remote_code
  trust_remote_code: true
  # Model revision for reproducibility
  revision: "dc7cdfe2ee4154fa7e30f5b51ca41bfa40174e68"
  # Torch dtype: float32 for FP16 AMP master weights; bfloat16 for A100/H100/L4
  dtype: "float32"

# ============================================================
# Training Configuration — Phase 1 (CPT)
# ============================================================
training:
  # Output directory (auto-resolved per environment)
  output_dir: "checkpoints/cpt"
  
  # Total target tokens
  target_tokens: 1_000_000_000  # 1B tokens
  
  # Sequence length — 2048 is safe with Liger Kernel on T4 (FusedLinearCrossEntropy
  # avoids materializing the full [seq, 248k] logits tensor).
  # Without Liger, auto_configure_batch_size() will reduce to 1024 at runtime.
  max_seq_length: 2048
  
  # Batch sizes — auto-configured at runtime based on GPU memory and Liger availability.
  # With Liger on T4: micro_batch=2, grad_accum=8 → 32 sequences/step → 65,536 tokens/step
  # Without Liger on T4: micro_batch=1, grad_accum=16 → 32 sequences/step → 32,768 tokens/step
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  # Effective batch = 2 * 8 * 2 GPUs = 32 sequences = 65,536 tokens/step (with Liger)
  
  # Learning rate
  learning_rate: 2.0e-5
  lr_scheduler_type: "cosine"
  min_lr_ratio: 0.1  # min_lr = 0.1 * learning_rate
  warmup_ratio: 0.02
  weight_decay: 0.01
  max_grad_norm: 1.0
  
  # Training duration
  num_train_epochs: 1
  # max_steps will be computed from target_tokens if set
  max_steps: -1  # -1 means compute from target_tokens
  
  # Precision and memory
  # Note: Tesla T4 lacks hardware BF16 Tensor Cores. Always use fp16=True on T4.
  bf16: false
  fp16: true
  gradient_checkpointing: true
  
  # ── Speed Optimizations ──
  # Liger Kernel: Fuses cross-entropy, RMSNorm, SwiGLU, RoPE into Triton kernels.
  # Saves ~40-60% VRAM (critical for 248k vocab) and ~15-20% throughput improvement.
  # Zero accuracy loss (mathematically identical). Works on T4 (SM75).
  use_liger_kernel: true
  
  # SDPA: PyTorch's native Scaled Dot-Product Attention. Auto-selects the best
  # kernel for your GPU (memory-efficient on T4). Unlike FlashAttention-2,
  # SDPA works on ALL architectures including Turing (SM75).
  use_sdpa: true
  
  # torch.compile: disabled to prevent PyTorch Dynamo parameter renaming conflicts with Accelerate
  use_torch_compile: false
  
  # Optimizer: paged_adamw_8bit is auto-enabled on <=16GB GPUs
  optim: "adamw_torch"
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_epsilon: 1.0e-8
  
  # Logging
  logging_steps: 10
  logging_first_step: true
  report_to: "none"
  run_name: "qwen35-0.8b-cpt"
  
  # Checkpointing
  save_strategy: "steps"
  save_steps: 500
  save_total_limit: 5
  resume_from_checkpoint: null  # Set to checkpoint path to resume
  
  # Evaluation
  eval_strategy: "steps"
  eval_steps: 500
  
  # Dataloader (0 workers prevents CPU RAM exhaustion and multi-worker IPC deadlocks in Colab/Kaggle)
  dataloader_num_workers: 0
  dataloader_pin_memory: true
  
  # Seed
  seed: 42
  data_seed: 42

# ============================================================
# Environment-specific overrides
# ============================================================
environment:
  # Auto-detected, but can be forced
  # Options: "local", "colab", "kaggle"
  type: "auto"
  
  # Colab-specific
  colab:
    per_device_train_batch_size: 2
    gradient_accumulation_steps: 8
    max_seq_length: 2048
    dataloader_num_workers: 0
    # T4: 16GB (Liger enables micro_batch=2, seq=2048)
    # L4: 24GB, A100: 40/80GB (bf16=True)
    
  # Kaggle-specific
  kaggle:
    per_device_train_batch_size: 2
    gradient_accumulation_steps: 8
    max_seq_length: 2048
    dataloader_num_workers: 0
    # T4x2: 2x16GB — with Liger: micro_batch=2, grad_accum=8, seq=2048
    # → 65,536 tokens/step → ~15,258 steps for 1B tokens
    #
    # TPU v5e-8 / PJRT: scripts/05_train_cpt.py invokes torch_xla.launch.
    # Do NOT use removed xla_spawn or torchrun --nproc_per_node=8: PJRT owns
    # process creation and discovers the TPU topology itself.
    # The 248k-token vocabulary makes the ordinary cross-entropy logits large;
    # batch 1 and seq_len 1024 are the conservative 16GB-HBM settings for a
    # first uninterrupted TPU run.  Liger is CUDA-only, so TPU uses the
    # ordinary unfused loss and must not use the GPU's 2048-token setting.
    # Per-replica batch size for TPU (grad_accum is forced to 1 at runtime):
    tpu_per_device_train_batch_size: 1
    tpu_max_seq_length: 1024

  # Local (for testing only)
  local:
    per_device_train_batch_size: 1
    gradient_accumulation_steps: 1
    max_seq_length: 512
    dataloader_num_workers: 0
    max_steps: 10

# ============================================================
# Storage Configuration
# ============================================================
storage:
  # HuggingFace Hub
  hf_hub:
    repo_id: null  # Set to your HF repo for checkpoint uploads
    push_checkpoints: false
    
  # Google Drive (Colab)
  gdrive:
    mount_path: "/content/drive"
    checkpoint_dir: "MyDrive/qwen-coder/checkpoints"
    data_dir: "MyDrive/qwen-coder/data"
    
  # Kaggle
  kaggle:
    output_dir: "/kaggle/working"
    
  # Processed data
  processed_data:
    # Can be local path, GDrive path, or HF dataset
    path: null  # Auto-resolved per environment
    format: "arrow"  # arrow or parquet
    shard_size_mb: 50
