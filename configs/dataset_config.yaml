# Dataset Configuration for Phase 1 CPT
# ============================================================
# Target: ~1B tokens after filtering and deduplication
# ============================================================

# Global settings
global:
  target_total_tokens: 1_000_000_000
  tokenizer: "Qwen/Qwen3.5-0.8B-Base"
  seed: 42
  
  # Oversampling factor: download/stream more than target to account
  # for filtering losses. Adjusted per-dataset based on expected filter rates.
  default_oversample_factor: 1.3

# ============================================================
# Dataset Mixture
# ============================================================
datasets:
  # ----------------------------------------------------------
  # 1. Stack v3 — Source Code (35%)
  # ----------------------------------------------------------
  stack_v3_code:
    source: "HuggingFaceCode/stack-v3-train"
    target_proportion: 0.35
    target_tokens: 350_000_000  # 350M tokens
    streaming: true
    split: "train"
    
    # Language filtering (applied to files[].language field)
    target_languages:
      - "Python"
      - "TypeScript"
      - "JavaScript"
      - "C++"
      - "C"
      - "Rust"
      - "Go"
      - "Java"
      - "Shell"
      - "SQL"
      - "HTML"
      - "CSS"
      - "Dockerfile"
    
    # Language proportions within code subset (user-specified targets)
    language_weights:
      Python: 0.25
      TypeScript: 0.13
      JavaScript: 0.10
      "C++": 0.07
      C: 0.05
      Rust: 0.04
      Go: 0.04
      Java: 0.05
      Shell: 0.06
      SQL: 0.09
      HTML: 0.05
      CSS: 0.04
      Dockerfile: 0.03
    
    # File filtering
    file_filters:
      min_file_size_bytes: 100
      max_file_size_bytes: 1_000_000  # 1MB
      min_alphanumeric_ratio: 0.25
      max_line_length: 1000
      min_line_count: 3
      max_line_count: 10000
      
      # Exclude by extension
      exclude_extensions:
        - ".json"
        - ".csv"
        - ".xml"
        - ".yaml"
        - ".yml"
        - ".lock"
        - ".min.js"
        - ".min.css"
        - ".map"
        - ".svg"
        - ".png"
        - ".jpg"
        - ".gif"
        - ".ico"
        - ".woff"
        - ".woff2"
        - ".ttf"
        - ".eot"
        - ".pb"
        - ".pyc"
        - ".class"
        - ".o"
        - ".so"
        - ".dll"
        - ".exe"
      
      # Exclude by filename pattern
      exclude_filename_patterns:
        - "package-lock.json"
        - "yarn.lock"
        - "pnpm-lock.yaml"
        - "Cargo.lock"
        - "poetry.lock"
        - "Pipfile.lock"
        - "composer.lock"
        - "Gemfile.lock"
        - "*_pb2.py"
        - "*.pb.go"
        - "*.generated.*"
        - "*.auto.*"
        - "*.min.*"
      
      # Exclude by path pattern
      exclude_path_patterns:
        - "node_modules/"
        - "vendor/"
        - "dist/"
        - "build/"
        - ".git/"
        - "__pycache__/"
        - ".tox/"
        - "venv/"
        - ".venv/"
        - "generated/"
        - "compiled/"
        - "migrations/"
        - "test_data/"
        - "fixtures/"
      
      # Config files to KEEP (exceptions to json/yaml exclusion)
      keep_config_patterns:
        - "Dockerfile"
        - "docker-compose.yml"
        - "docker-compose.yaml"
        - ".github/workflows/*.yml"
        - ".github/workflows/*.yaml"
        - "Makefile"
        - "CMakeLists.txt"
        - "setup.py"
        - "setup.cfg"
        - "pyproject.toml"
        - "Cargo.toml"
        - "go.mod"
        - "tsconfig.json"
        - "webpack.config.*"
        - "vite.config.*"
        - ".eslintrc.*"
        - ".prettierrc*"
        - "jest.config.*"
    
    # Repository-level quality signals
    repo_filters:
      exclude_forks: true
      min_stars: 0  # Don't filter by stars — many good repos have 0
      exclude_vendor: true  # Use is_vendor field
    
    # FIM (Fill-in-the-Middle) formatting
    fim:
      enabled: true
      rate: 0.5  # 50% of code samples formatted as FIM
      fim_prefix_token: "<|fim_prefix|>"
      fim_middle_token: "<|fim_middle|>"
      fim_suffix_token: "<|fim_suffix|>"

  # ----------------------------------------------------------
  # 2. Stack v3 — Documentation (20%)
  # ----------------------------------------------------------
  stack_v3_docs:
    source: "HuggingFaceCode/stack-v3-train"
    target_proportion: 0.20
    target_tokens: 200_000_000  # 200M tokens
    streaming: true
    split: "train"
    
    # Only keep documentation files
    doc_extensions:
      - ".md"
      - ".rst"
      - ".txt"
      - ".adoc"
    
    doc_filename_patterns:
      - "README*"
      - "CONTRIBUTING*"
      - "CHANGELOG*"
      - "HISTORY*"
      - "DOCS*"
      - "docs/*"
      - "doc/*"
      - "documentation/*"
      - "guide/*"
      - "tutorial/*"
      - "wiki/*"
    
    # Quality filtering for docs
    doc_filters:
      min_length_chars: 200
      max_length_chars: 500_000
      min_alphanumeric_ratio: 0.50
      
      # Language detection
      language_detection:
        enabled: true
        model: "fasttext"  # fasttext lid.176.bin
        min_english_confidence: 0.70
      
      # Exclude boilerplate docs
      exclude_patterns:
        - "LICENSE*"
        - "LICENCE*"
        - "COPYING*"
        - "NOTICE*"
        - "PATENTS*"
        - "SECURITY*"
        - "CODE_OF_CONDUCT*"
      
      # Exclude low-value docs
      max_boilerplate_ratio: 0.4  # Ratio of repeated/template lines
      min_content_density: 0.3   # Ratio of substantive content

  # ----------------------------------------------------------
  # 3. FineWeb-HQ — High-Quality Web Text (15%)
  # ----------------------------------------------------------
  fineweb_hq:
    source: "epfml/FineWeb-HQ"
    target_proportion: 0.15
    target_tokens: 150_000_000  # 150M tokens
    streaming: true
    split: "train"
    
    filters:
      # Quality score threshold (dataset provides quality_score)
      min_quality_score: null  # Will be calibrated during exploration
      
      # Language filtering
      language_detection:
        enabled: true
        model: "fasttext"
        min_english_confidence: 0.80
      
      # Content filtering
      min_length_chars: 200
      max_length_chars: 200_000
      min_alphanumeric_ratio: 0.60
      
      # Web boilerplate removal
      remove_boilerplate: true
      boilerplate_patterns:
        - "cookie"
        - "privacy policy"
        - "terms of service"
        - "subscribe to newsletter"
        - "sign up for"
        - "click here"
        - "all rights reserved"
        - "copyright ©"

  # ----------------------------------------------------------
  # 4. OpenWebMath — Mathematical Content (10%)
  # ----------------------------------------------------------
  openwebmath:
    source: "open-web-math/open-web-math"
    target_proportion: 0.10
    target_tokens: 100_000_000  # 100M tokens
    streaming: true
    split: "train"
    
    filters:
      min_length_chars: 100
      max_length_chars: 200_000
      
      # Math-specific quality filters
      math_quality:
        # Require some LaTeX or mathematical notation
        min_math_density: 0.01  # At least 1% of content is math-related
        reject_broken_latex: true
        reject_ocr_artifacts: true
        max_repeated_line_ratio: 0.3  # Detect duplicated content
      
      # Language filtering (math text should be in English)
      language_detection:
        enabled: true
        model: "fasttext"
        min_english_confidence: 0.60  # Lower threshold — math has many symbols

  # ----------------------------------------------------------
  # 5. The Vault — Function-Level Code (20%)
  # ----------------------------------------------------------
  the_vault:
    source: "Fsoft-AIC/the-vault-function"
    target_proportion: 0.20
    target_tokens: 200_000_000  # 200M tokens
    streaming: true
    # The Vault uses split_set parameter
    split_set: ["train"]
    
    # Languages supported by The Vault
    target_languages:
      - "Python"
      - "JavaScript"
      - "Java"
      - "Go"
      - "Rust"
      - "C++"
      - "C"
      - "C#"
      - "Ruby"
      - "PHP"
    
    filters:
      # Function-level quality
      min_code_length_chars: 50
      max_code_length_chars: 50_000
      min_alphanumeric_ratio: 0.30
      
      # Deduplicate against Stack v3
      cross_dedup_with_stack: true
    
    # Format: include both code and docstring/identifier
    include_docstring: true
    include_identifier: true

# ============================================================
# Deduplication Configuration
# ============================================================
deduplication:
  # Exact dedup via content hash
  exact:
    enabled: true
    algorithm: "sha256"
    # Hash the normalized content (stripped whitespace)
    normalize: true
  
  # Near-dedup via MinHash
  minhash:
    enabled: true
    num_perm: 128
    threshold: 0.7  # Jaccard similarity threshold
    ngram_size: 5
    # Only run within each dataset (not cross-dataset for memory)
    cross_dataset: false
  
  # Statistics
  report_stats: true

# ============================================================
# Processing Configuration
# ============================================================
processing:
  # Number of parallel workers for filtering
  num_workers: 4
  
  # Batch size for processing
  batch_size: 1000
  
  # Output format
  output_format: "arrow"  # arrow or parquet
  shard_size_mb: 500
  
  # Tokenization
  tokenization:
    add_eos: true
    add_bos: false  # Qwen3.5 has no BOS token
    
  # Document packing
  packing:
    enabled: true
    max_seq_length: 4096
    # Use EOS token as document separator
    separator_token: "<|endoftext|>"
    # Create proper attention masks for packed sequences
    create_attention_mask: true
    # Allow partial documents at end of sequence
    allow_partial: true
  
  # Checkpointing for resumable processing
  checkpoint_every_n_samples: 100_000
  
  # Mixture reporting
  report_mixture: true
