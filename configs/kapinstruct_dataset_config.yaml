# ==============================================================================
# KapInstruct-100M: Dataset Configuration
# ==============================================================================
# Target: Exactly 100,000,000 final usable content tokens post-filtering & dedup
# Tokenizer: Qwen/Qwen3.5-0.8B-Base (ChatML format)
# Sequence Length: 4096 packed sequences
# Loss Policy: assistant_only (trainable loss calculated on assistant outputs only)
# ==============================================================================

global:
  name: "KapInstruct-100M"
  version: "1.0.0"
  target_usable_tokens: 100_000_000  # 100M usable content tokens
  tokenizer: "Qwen/Qwen3.5-0.8B-Base"
  tokenizer_revision: "main"
  seed: 42
  default_oversample_factor: 1.4
  loss_policy: "assistant_only"  # "assistant_only" or "all_tokens"
  chat_template_format: "chatml" # "chatml" or "auto"
  publication:
    hf_dataset_id: "kaptaan45/KapInstruct-100M"
    kaggle_dataset_id: "kaptaan45/kapinstruct-100m"

# ==============================================================================
# Source Definitions & Exact Token Allocations
# ==============================================================================
sources:
