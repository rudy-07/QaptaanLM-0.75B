# ==============================================================================
# Quality Filtering Configuration
# ==============================================================================
filters:
  # Language detection
  language_detection:
    enabled: true
    min_english_confidence: 0.65
    allow_code_mixed_english: true

  # Code quality & language normalization
  code_languages:
    allowlist:
      - "python"
      - "javascript"
      - "typescript"
      - "java"
      - "c"
      - "cpp"
      - "csharp"
      - "go"
      - "rust"
      - "ruby"
      - "php"
      - "sql"
      - "shell"
      - "html"
      - "css"
      - "dockerfile"
    reject_secrets: true
    reject_minified: true

  # General instruction filters
  general:
    min_prompt_length_chars: 10
    min_response_length_chars: 15
    max_response_length_chars: 120_000
    max_repeated_line_ratio: 0.35
    reject_prompt_injection: true

  # Math quality filters
  math:
    reject_broken_latex: true
    reject_ocr_artifacts: true
    preserve_math_symbols: true

# ==============================================================================
# Deduplication Configuration
# ==============================================================================
deduplication:
  global_exact:
    enabled: true
    algorithm: "sha256"
    normalize_whitespace: true
    normalize_case: false  # Case sensitive for code accuracy
  minhash:
    enabled: false
    threshold: 0.80

# ==============================================================================
# Tokenization & Packing Configuration
# ==============================================================================
processing:
  output_format: "arrow"  # "arrow" (IPC) or "parquet"
  max_seq_length: 4096
  shard_size_mb: 50
  max_sequences_per_shard: 2000
  checkpoint_interval_docs: 20000
