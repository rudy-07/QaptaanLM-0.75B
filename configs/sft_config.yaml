# ============================================================
# QaptaanLM-0.75B (Qwen3.5-0.8B) JAX SFT Configuration
# Stage 2: Supervised Fine-Tuning on KapInstruct-100M
# Optimized for Google Kaggle TPU v5e-8 (8 TPU cores, 16GB HBM/core)
# ============================================================

model:
  # Base CPT model (loads from Hugging Face Hub or local path)
  name_or_path: "kaptaan45/QaptaanLM-0.75B"
  dtype: "bfloat16"
  vocab_size: 248320
  hidden_size: 1024
  intermediate_size: 3584
  num_hidden_layers: 24
  num_attention_heads: 8
  num_key_value_heads: 2
  head_dim: 256
  rms_norm_eps: 1.0e-6
  tie_word_embeddings: true
  full_attention_interval: 4
  linear_conv_kernel_dim: 4
  linear_num_key_heads: 16
  linear_num_value_heads: 16
  linear_key_head_dim: 128
  linear_value_head_dim: 128

training:
  output_dir: "checkpoints/jax_sft"
  target_tokens: 100_000_000  # 100 Million tokens (1 epoch baseline)
  
  # Sequence length & lazy windowing over 4096-token packed shards
  max_seq_length: 1024
  dataset_packed_seq_length: 4096
  
  # High-throughput batch sizing (safe micro-batch + scan gradient accumulation):
  # micro_batch=4, grad_accum=2 -> 8 sequences = 8,192 tokens/step (~12,208 steps)
  # Uses ~4.2GB VRAM with RematDecoderLayer and checkpointed scan (zero OOM risk)
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 2
  
  # Fast linear cross-entropy chunk size
  loss_chunk_size: 512
  
  # SFT-specific Learning rate and cosine scheduler
  # 5.0e-6 (lower than CPT's 2.0e-5) to preserve foundation code knowledge
  learning_rate: 5.0e-6
  min_lr_ratio: 0.0        # Full cosine decay to 0.0 for SFT
  warmup_ratio: 0.03       # 3% warmup (~183 steps)
  warmup_steps: null       # auto-computed from target_tokens if null
  weight_decay: 0.01
  max_grad_norm: 1.0
  
  # AdamW optimizer settings (clean optimizer state for SFT)
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_epsilon: 1.0e-8
  
  # Precision & seed
  dtype: "bfloat16"
  seed: 42
  
  # Validation split (hold out 1.5% ~1.5M tokens for in-training eval)
  eval_split_ratio: 0.015
  eval_steps: 250
  
  # Logging & Checkpointing (save every 500 steps, max 2 checkpoints)
  logging_steps: 25
  save_steps: 500
  save_total_limit: 2
  resume_from_checkpoint: null  # null = auto-discover newest in output_dir

storage:
  data_dir: "/kaggle/working/data"
  export_hf: true
  hf_export_dir: "checkpoints/jax_sft_hf"
